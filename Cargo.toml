[package]
name = "socket-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "socket_core"
path = "src/lib.rs"

[[bin]]
name = "socket-core"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "set-header"] }

# Runtime y async
tokio = { version = "1", features = ["full"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilidades
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Concurrencia
dashmap = "6.2"

# Async utilities (split de WS de axum)
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Seguridad: JWT + API Keys + SQLite
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
subtle = "2"
ipnet = "2"
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
url = "2"
