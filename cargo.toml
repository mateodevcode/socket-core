[package]
name = "socket-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "socket_core"
path = "src/lib.rs"

[[bin]]
name = "socket-core"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "set-header"] }

# Runtime y async
tokio = { version = "1", features = ["full"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilidades
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Concurrencia
dashmap = "5.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenv = "0.15"

# WebSocket cliente (para comunicación inter-servicios)
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"

# Seguridad: JWT + API Keys + SQLite
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
