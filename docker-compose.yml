services:
  socket-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socket-core
    # unless-stopped: on-failure:5 no garantiza sobrevivir a reinicios del daemon/VPS
    # (no se ha probado ese escenario). Revisa `docker compose logs` si hay bucles.
    restart: unless-stopped
    # Debe ser > SHUTDOWN_GRACE_SECS (validado <20) para permitir el apagado limpio.
    stop_grace_period: 20s
    # Endurecimiento: FS de solo lectura, sin capabilities, sin escalada.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # SQLite/temp y ficheros efímeros.
      - /tmp:size=16m,mode=1777
    pids_limit: 256
    mem_limit: 256m
    cpus: "1.0"
    ports:
      # Solo loopback; el acceso externo entra por Nginx con TLS.
      # ADMIN_PORT (3015) NO se publica: el panel admin vive en 127.0.0.1 del
      # contenedor y solo es accesible vía `docker exec` (o túnel interno).
      - "127.0.0.1:3005:3005"
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=3005
      - ADMIN_PORT=3015
      - DATABASE_URL=sqlite:/app/data/socket-core.db?mode=rwc
    volumes:
      # El host debe permitir escritura al UID 10001 del contenedor:
      #   sudo chown -R 10001:10001 ./data
      - ./data:/app/data
    networks:
      - central_network
    healthcheck:
      # Prueba AMBOS listeners (público y admin) dentro del contenedor.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3005/health >/dev/null && curl -fsS http://127.0.0.1:3015/health >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  central_network:
    external: true
