# ws.seventwo.tech — socket-core definitivo (público, endurecido).
# Gestionado por deploy (repo: nginx/). No editar a mano en el VPS.
# Requiere: nginx/conf.d/socketcore-limits.conf (zonas + formato ws_clean).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ws.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/ws.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    # Cabeceras de seguridad (HSTS + no filtrar referer).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    # Log SIN query strings: el ?token= del WS no queda guardado.
    access_log /var/log/nginx/ws.seventwo.tech.access.log ws_clean;

    # /admin/* no existe aquí: el admin vive en ADMIN_PORT (loopback del contenedor).
    location /admin/ {
        return 404;
    }

    # Emisión de JWT: freno estricto por IP (anti fuerza bruta).
    location = /auth/token {
        limit_req zone=ws_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Salud (público).
    location = /health {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stats del proyecto (REST).
    location = /stats {
        limit_req zone=ws_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canales y eventos (REST).
    location /channels {
        limit_req zone=ws_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket. 30 conexiones/IP: la renovación del SDK solapa brevemente dos
    # conexiones por usuario (nueva antes de cerrar la vieja), así que el cupo
    # debe ser mayor que el número de usuarios por IP.
    location /ws {
        limit_conn ws_conn 30;
        limit_req zone=ws_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cualquier otra ruta no existe en el hub.
    location / {
        return 404;
    }
}
