# ws.seventwo.tech — fase puerto 80: retos ACME + redirección a HTTPS.
# Gestionado por deploy (repo: nginx/). No editar a mano en el VPS.
server {
    listen 80;
    listen [::]:80;
    server_name ws.seventwo.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
