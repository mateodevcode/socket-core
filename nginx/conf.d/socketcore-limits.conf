# Zonas de rate-limit + formato de log del hub (solo ws.seventwo.tech lo usa).
# Gestionado por deploy. Va en conf.d = contexto http (las zones NO pueden ir en un site).
limit_req_zone $binary_remote_addr zone=ws_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ws_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# Como $request incluye "?token=...", se loguea método + path SIN query.
log_format ws_clean '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
