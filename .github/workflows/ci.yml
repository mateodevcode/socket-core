name: CI

on:
  pull_request:
  push:
    branches: [main, security-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2.7.8

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked

      - name: Auditoría de dependencias
        run: cargo audit

  deploy:
    name: Despliegue al VPS
    # needs: el deploy NO arranca si quality falla.
    needs: [quality]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "🚀 Iniciando despliegue de socket-core..."

            # 1. Ir al directorio de trabajo en el VPS
            cd /srv/infra/socket-core

            # 2. Guardar el commit actual (para rollback) y respaldar datos
            PREV=$(git rev-parse HEAD)
            echo "$PREV" > .last_deploy_commit
            echo "→ Commit previo: $PREV (guardado en .last_deploy_commit)"

            BACKUP_DIR=/srv/infra/socket-core/backups
            mkdir -p "$BACKUP_DIR"
            STAMP=$(date +%Y%m%d-%H%M%S)
            echo "→ Backup de datos ANTES de reconstruir: data-$STAMP.tgz"
            sudo tar czf "$BACKUP_DIR/data-$STAMP.tgz" -C /srv/infra/socket-core data
            # Retención: conserva los 10 backups más recientes.
            ls -1t "$BACKUP_DIR"/data-*.tgz 2>/dev/null | tail -n +11 | xargs -r sudo rm -f

            echo "→ Respaldando .env (no versionado)..."
            cp .env /tmp/socket-core.env.bak 2>/dev/null || true

            echo "→ Descartando cambios locales no versionados..."
            git reset --hard HEAD
            # -e = exclusiones explícitas: ni aunque falle el .gitignore se tocan.
            git clean -fd -e proyectos/ -e .env -e data/ -e backups/ -e .last_deploy_commit

            echo "→ Restaurando .env ..."
            cp /tmp/socket-core.env.bak .env 2>/dev/null || true
            rm -f /tmp/socket-core.env.bak

            echo "→ Permisos del volumen para el usuario no-root del contenedor (UID 10001)..."
            sudo chown -R 10001:10001 data

            echo "→ Actualizando código desde GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Verificando que exista el .env..."
            if [ ! -f .env ]; then
              echo "❌ Falta el archivo .env en /srv/infra/socket-core/"
              echo "   Copia el contenido de tu .env.production local como .env y re-ejecuta el deploy."
              exit 1
            fi

            echo "→ Construyendo servicio (Rust release)..."
            docker compose build socket-core

            echo "→ Liberando nombre/puerto si el socket-core viejo sigue ocupándolo..."
            if docker ps -a --format '{{.Names}}' | grep -qx socket-core; then
              echo "⚠️ Existe un contenedor previo llamado socket-core. Se elimina para migrar."
              docker rm -f socket-core || true
            fi

            echo "→ Levantando contenedor..."
            docker compose up -d --remove-orphans

            echo "→ Limpiando imágenes viejas..."
            docker image prune -f

            echo "→ Verificando salud del servicio..."
            sleep 5
            docker compose ps | grep "Up" || (echo "❌ Error: el contenedor no está corriendo" && exit 1)
            curl -f http://127.0.0.1:3005/health || (echo "❌ Error: /health no responde" && exit 1)
            docker exec socket-core curl -fsS http://127.0.0.1:3015/health >/dev/null \
              || (echo "❌ Error: el listener admin no responde dentro del contenedor" && exit 1)

            echo "→ Borde público Nginx (SOLO archivos ws.*/socketcore-*, otros dominios intactos)..."
            sudo cp /etc/nginx/sites-available/ws.seventwo.tech.http.conf /tmp/ws.http.bak 2>/dev/null || true
            sudo cp /etc/nginx/sites-available/ws.seventwo.tech.https.conf /tmp/ws.https.bak 2>/dev/null || true
            sudo cp nginx/ws.seventwo.tech.http.conf /etc/nginx/sites-available/ws.seventwo.tech.http.conf
            sudo ln -sf /etc/nginx/sites-available/ws.seventwo.tech.http.conf /etc/nginx/sites-enabled/ws.seventwo.tech.http.conf
            sudo cp nginx/conf.d/socketcore-limits.conf /etc/nginx/conf.d/socketcore-limits.conf
            sudo mkdir -p /var/www/html

            echo "→ Activando fase 80 ANTES del cert..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "→ Certificado: se crea SOLO si falta y SOLO para ws.seventwo.tech..."
            if [ ! -f /etc/letsencrypt/live/ws.seventwo.tech/fullchain.pem ]; then
              sudo certbot certonly --webroot -w /var/www/html \
                -d ws.seventwo.tech --non-interactive --agree-tos
            else
              echo "→ Certificado ya existe, no se toca."
            fi

            echo "→ Activando bloque 443..."
            sudo cp nginx/ws.seventwo.tech.https.conf /etc/nginx/sites-available/ws.seventwo.tech.https.conf
            sudo ln -sf /etc/nginx/sites-available/ws.seventwo.tech.https.conf /etc/nginx/sites-enabled/ws.seventwo.tech.https.conf

            echo "→ fail2ban anti-abuso (401/403; los 429 NO cuentan)..."
            sudo cp fail2ban/filter.d/socketcore-auth.conf /etc/fail2ban/filter.d/socketcore-auth.conf
            sudo cp fail2ban/jail.d/socketcore-auth.conf /etc/fail2ban/jail.d/socketcore-auth.conf
            sudo fail2ban-client reload
            sudo fail2ban-client status socketcore-auth || true

            echo "→ Verificando Nginx ANTES de recargar..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "→ Chequeo público final..."
            OK=0
            for i in 1 2 3 4 5 6; do
              if curl -f --max-time 10 https://ws.seventwo.tech/health; then
                OK=1
                break
              fi
              echo "→ intento $i falló, reintentando en 10s..."
              sleep 10
            done
            [ "$OK" = "1" ] || (echo "❌ Error: https://ws.seventwo.tech/health no responde" && exit 1)

            echo "→ Estado final:"
            docker compose ps

            echo "✅ ¡Despliegue de socket-core completado!"
            echo "   Backup de datos: $BACKUP_DIR/data-$STAMP.tgz"
            echo "   Rollback: ver SECURITY.md §5 (commit previo: $PREV)."
