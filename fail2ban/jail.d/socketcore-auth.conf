# 30 fallos de auth (401/403) en 5 min -> baneo 1h en http+https.
# Solo vigila el log dedicado de ws.seventwo.tech (otros dominios intactos).
[socketcore-auth]
enabled = true
# Ubuntu 24.04 usa systemd por defecto; forzar auto para que respete logpath.
backend = auto
# Nunca banear loopback ni la red interna de Docker.
ignoreip = 127.0.0.1/8 ::1 172.18.0.0/16
port = http,https
filter = socketcore-auth
logpath = /var/log/nginx/ws.seventwo.tech.access.log
maxretry = 30
findtime = 300
bantime = 3600
