# fail2ban: banea IPs que fallen auth contra el hub.
# Log dedicado ws_clean: "<IP> - ... "[METODO] [PATH-sin-query] ..." 401|403 ..."
# IMPORTANTE: solo 401/403. Los 429 (rate limit) NO cuentan para el baneo.
[Definition]
failregex = ^<HOST> .* "[A-Z]+ \S+ HTTP[^"]*" (401|403) \d+ .*$
ignoreregex =
